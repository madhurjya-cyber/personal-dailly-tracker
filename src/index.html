<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DailyScore</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>

    <header class="app-header">

        <h1>DailyScore</h1>

        <p>Personal Habit & Productivity Tracker</p>

    </header>


    <main class="container">


        <!-- Today's Tracker -->

        <section class="today-section">

            <h2>Today's Tracker</h2>

            <p id="current-date">
                Loading date...
            </p>

        </section>



        <!-- Activities -->

        <section class="activities-section">

            <div class="section-header">

                <h2>Activities</h2>

                <button id="add-activity-btn">
                    + Add Activity
                </button>

            </div>


            <div id="activity-list">

                <!-- Activities will be added here using JavaScript -->

            </div>

        </section>



        <!-- Today's Score -->

        <section class="score-section">

            <h2>Today's Score</h2>


            <div class="score-display">

                <span id="score">0</span>

                <span>/</span>

                <span id="max-score">0</span>

            </div>


            <p id="score-percentage">
                0%
            </p>

        </section>



        <!-- History -->

        <section class="history-section">

            <div class="section-header">

                <h2>History</h2>

            </div>


            <div id="history-list">

                <p>
                    No previous days recorded yet.
                </p>

            </div>

        </section>
        <!-- Weekly Summary -->

<section class="weekly-section">

    <div class="section-header">

        <h2>Weekly Summary</h2>

    </div>

    <div id="weekly-summary">

        <p>
            No weekly data available yet.
        </p>

    </div>

</section>
<!-- Monthly Summary -->

<section class="monthly-section">

    <div class="section-header">

        <h2>Monthly Summary</h2>

    </div>

    <div id="monthly-summary">

        <p>
            No monthly data available yet.
        </p>

    </div>

</section>


    </main>


    <script src="js/app.js"></script>

</body>

</html>
